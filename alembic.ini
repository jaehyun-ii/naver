# Alembic 설정 — 제어평면(Postgres) 스키마 마이그레이션.
#
# 운영 스키마 적용:  alembic -c alembic.ini upgrade head
# DB URL 은 env.py 가 애플리케이션 설정(get_settings().store.dsn)에서 읽는다.
# 필요 시 환경변수 LLMOPS_ALEMBIC_URL 또는 아래 sqlalchemy.url 로 오버라이드할 수 있다.

[alembic]
script_location = migrations
prepend_sys_path = .
# 비워두면 env.py 가 앱 설정(store.dsn)에서 채운다.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
