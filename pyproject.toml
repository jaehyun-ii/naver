[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmops-core"
version = "0.1.0"
description = "자체 LLMOps 플랫폼 코어 — 각 오픈소스의 핵심 모듈만 추출해 조립한 단일 사내 코드베이스 (design_v2)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

# ── 코어 글루(항상 필요): 설정·스키마·S3·텔레메트리·게이트웨이 API ──
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",  # 파일 업로드(문서 인제스트) — FastAPI UploadFile/Form
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "boto3>=1.34",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
    "PyYAML>=6.0",
]

# ── 모듈별 선택 의존성: 필요한 계층만 설치 (design_v2의 모드별 채용) ──
[project.optional-dependencies]
# ── 상류 데이터 파이프라인 (L1~L3) ──
ingestion = ["pyspark>=3.5"]
quality = [
    "great-expectations>=0.18",
    # PII 마스킹(입출력 가드레일 포함). 언어별 spaCy 모델 필요:
    #   en → python -m spacy download en_core_web_lg
    #   ko → pip install ko_core_news_sm  (guardrails.pii_languages 기본 ['ko','en'])
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "datasketch>=1.6",
    "fasttext-wheel>=0.9.2",
    "argilla>=2.0",
    "pandas>=2.0",
]
dataset = ["datasets>=2.19", "dvc[s3]>=3.50"]
# ── 문서 ETL (PDF → content_list.json, MinerU hybrid) ──
# noksan_ax 파이프라인 이식. MinerU는 stock(비수정) — 같은 버전만 설치하면 동일.
# 실제 VLM 추론은 별도 서버(PARSER_ENDPOINT)에서. pdftext=병합 후처리, pymupdf=이미지 크롭.
etl = ["mineru[pipeline]>=3.3.1", "pdftext>=0.6", "pymupdf>=1.24", "pypdf>=5.6"]
# ── 하류 런타임 (L4~L7) ──
# redis: 공유 응답 캐시 + 분산 RPM 리미터(다중 인스턴스). gateway.redis_url 설정 시에만 필요.
gateway = ["litellm>=1.40", "redis>=5.0"]
orchestration = ["langchain-core>=0.2"]
rag = [
    "llama-index-core>=0.10",
    "llama-index-vector-stores-qdrant>=0.2",
    "qdrant-client>=1.9",
    "sentence-transformers>=2.7",
]
# transformers 5.9+ : hyperclovax(SEED-Think) 네이티브 지원. unsloth는 tf5 미대응+GB10 프리빌트 없음 → 코드에서 optional(가드).
training = ["trl>=1.7", "peft>=0.17", "transformers>=5.9", "datasets>=3.0", "accelerate>=1.2"]
serving = ["vllm>=0.5"]
tuning = ["optuna>=3.6"]
tracking = ["mlflow>=2.13", "dvc[s3]>=3.50"]
# alembic: 제어평면 Postgres 스키마 마이그레이션(prod: alembic upgrade head). SQLAlchemy 동반 설치.
store = ["psycopg2-binary>=2.9", "alembic>=1.13", "SQLAlchemy>=2.0"]
secrets = ["hvac>=2.0"]
evaluation = ["ragas>=0.1.7", "deepeval>=0.21"]
telemetry-langfuse = ["langfuse>=2.36"]

# 개발/CI
dev = ["pytest>=8.2", "ruff>=0.4", "mypy>=1.10"]

# 전체(GPU 박스 풀 설치)
all = [
    "pyspark>=3.5",
    "great-expectations>=0.18", "presidio-analyzer>=2.2", "presidio-anonymizer>=2.2",
    "datasketch>=1.6", "fasttext-wheel>=0.9.2", "argilla>=2.0", "pandas>=2.0",
    "litellm>=1.40", "redis>=5.0", "langchain-core>=0.2",
    "llama-index-core>=0.10", "llama-index-vector-stores-qdrant>=0.2",
    "qdrant-client>=1.9", "sentence-transformers>=2.7",
    "trl>=1.7", "peft>=0.17", "transformers>=5.9", "datasets>=3.0",
    "optuna>=3.6", "mlflow>=2.13", "dvc[s3]>=3.50",
    "ragas>=0.1.7", "deepeval>=0.21",
    "psycopg2-binary>=2.9", "alembic>=1.13", "SQLAlchemy>=2.0",
]

[tool.setuptools.packages.find]
include = ["llmops_core*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
