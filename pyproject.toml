[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmops-core"
version = "0.1.0"
description = "자체 LLMOps 플랫폼 코어 — 각 오픈소스의 핵심 모듈만 추출해 조립한 단일 사내 코드베이스 (design_v2)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

# ── 코어 글루(항상 필요): 설정·스키마·S3·텔레메트리·게이트웨이 API ──
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "boto3>=1.34",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
    "PyYAML>=6.0",
]

# ── 모듈별 선택 의존성: 필요한 계층만 설치 (design_v2의 모드별 채용) ──
[project.optional-dependencies]
# ── 상류 데이터 파이프라인 (L1~L3) ──
ingestion = ["pyspark>=3.5"]
quality = [
    "great-expectations>=0.18",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "datasketch>=1.6",
    "fasttext-wheel>=0.9.2",
    "argilla>=2.0",
    "pandas>=2.0",
]
dataset = ["datasets>=2.19", "dvc[s3]>=3.50"]
# ── 하류 런타임 (L4~L7) ──
gateway = ["litellm>=1.40"]
orchestration = ["langchain-core>=0.2"]
rag = ["llama-index-core>=0.10", "qdrant-client>=1.9"]
training = ["unsloth", "trl>=0.9", "peft>=0.11", "transformers>=4.41", "datasets>=2.19"]
serving = ["vllm>=0.5"]
tuning = ["optuna>=3.6"]
tracking = ["mlflow>=2.13", "dvc[s3]>=3.50"]
store = ["psycopg2-binary>=2.9"]
secrets = ["hvac>=2.0"]
evaluation = ["ragas>=0.1.7", "deepeval>=0.21"]
telemetry-langfuse = ["langfuse>=2.36"]

# 개발/CI
dev = ["pytest>=8.2", "ruff>=0.4", "mypy>=1.10"]

# 전체(GPU 박스 풀 설치)
all = [
    "pyspark>=3.5",
    "great-expectations>=0.18", "presidio-analyzer>=2.2", "presidio-anonymizer>=2.2",
    "datasketch>=1.6", "fasttext-wheel>=0.9.2", "argilla>=2.0", "pandas>=2.0",
    "litellm>=1.40", "langchain-core>=0.2",
    "llama-index-core>=0.10", "qdrant-client>=1.9",
    "trl>=0.9", "peft>=0.11", "transformers>=4.41", "datasets>=2.19",
    "optuna>=3.6", "mlflow>=2.13", "dvc[s3]>=3.50",
    "ragas>=0.1.7", "deepeval>=0.21",
]

[tool.setuptools.packages.find]
include = ["llmops_core*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
