# 인프라 서비스 (Service 모드 — 모듈로 분해하지 않는 종속).
# 코어(llmops_core)는 이들을 외부 종속으로 client/SDK로만 접근한다.
# 로컬 개발/검증용. 운영은 deploy/ 하위 Helm 차트로 K8s 배포.
name: llmops-infra

services:
  # ── S3 백본 (MinIO → Phase2 NCP Object Storage 교체 지점) ──
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    # 호스트 9000/9001이 타 프로젝트에 점유되어 19000/19001로 노출(컨테이너 내부는 9000 유지)
    ports: ["19000:9000", "19001:9001"]
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 버킷 부트스트랩 ({env}-{domain}-{purpose})
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/dev-demo-datasets local/dev-demo-models local/dev-shared-eval local/dev-shared-langfuse;
      echo 'buckets ready';
      "

  # ── 벡터 DB (qdrant_client만 임베드) ──
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]

  # ── MLflow 메타 백엔드 ──
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]

  # ── MLflow Tracking 서버 (클라이언트만 임베드, 서버는 Service) ──
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    depends_on: [postgres, minio]
    command: >
      /bin/sh -c "pip install psycopg2-binary boto3 >/dev/null 2>&1;
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://mlflow:mlflow@postgres/mlflow
      --artifacts-destination s3://dev-demo-models"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    ports: ["5000:5000"]

  # ── 관측성 옵션 B: OTel Collector + Jaeger (자체 구축 백본) ──
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["./otel/collector.yaml:/etc/otel/config.yaml:ro"]
    depends_on: [jaeger]
    ports: ["4317:4317", "4318:4318"]

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686"]  # Jaeger UI

  # ── 코어 앱: 게이트웨이 (OpenAI 호환 단일 진입점) ──
  gateway:
    build:
      context: ..
      dockerfile: deploy/app/Dockerfile
    image: llmops/core:latest # console과 동일 이미지 재사용
    depends_on: [postgres, minio, qdrant, mlflow, otel-collector]
    environment: &app_env
      LLMOPS_ENV: dev
      LLMOPS_DOMAIN: demo
      LLMOPS_S3__ENDPOINT_URL: http://minio:9000
      LLMOPS_S3__ACCESS_KEY: minioadmin
      LLMOPS_S3__SECRET_KEY: minioadmin
      LLMOPS_QDRANT__URL: http://qdrant:6333
      # ── RAG 서빙 검색 스택: Nemotron-1B parent-직접 + VL 리랭커 (벤치 92%/무앵커 87.5%) ──
      LLMOPS_RAG__EMBEDDER: st
      LLMOPS_RAG__EMBEDDING_MODEL: nvidia/Nemotron-3-Embed-1B-BF16
      LLMOPS_RAG__QUERY_PROMPT: query
      LLMOPS_RAG__BACKEND: qdrant_parents
      LLMOPS_RAG__COLLECTION: regs_parents_nem1b
      LLMOPS_RAG__PARENT_DB: /home/jaehyun/Dev/naver/data_chunks_full/rag_parents.db
      LLMOPS_RAG__RERANKER_MODEL: nvidia/llama-nemotron-rerank-vl-1b-v2
      LLMOPS_RAG__TOP_K: "4"
      LLMOPS_MLFLOW__TRACKING_URI: http://mlflow:5000
      LLMOPS_TELEMETRY__BACKEND: otel
      LLMOPS_TELEMETRY__OTLP_ENDPOINT: http://otel-collector:4317
      LLMOPS_GATEWAY__MASTER_KEY: sk-master-changeme
      LLMOPS_GATEWAY__CONFIG_PATH: /app/config/model_list.yaml
      # 영속·HA: 제어평면 상태(키·승인·예산·런)를 Postgres에 보존(게이트웨이↔콘솔 공유)
      LLMOPS_STORE__BACKEND: postgres
      LLMOPS_STORE__DSN: postgresql://mlflow:mlflow@postgres:5432/mlflow
    volumes: ["../config:/app/config:ro"] # 모델 라우팅 라이브 편집
    extra_hosts: ["host.docker.internal:host-gateway"] # 호스트 :8000(SEED 서버) 라우팅용
    command:
      ["uvicorn", "llmops_core.gateway.app:app", "--host", "0.0.0.0", "--port", "4000"]
    # 호스트 4000이 점유되어 14000으로 노출(컨테이너 내부/서비스명은 4000 유지)
    ports: ["14000:4000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── 코어 앱: 콘솔 (운영 UI — 키/예산/모델·챗·승인·데이터셋) ──
  console:
    image: llmops/core:latest
    depends_on: [gateway]
    environment:
      <<: *app_env
      # ── real 모드 오케스트레이션(콘솔이 host dockerd로 학습/서빙 컨테이너 실행) ──
      # 주의: 경로는 host dockerd가 -v 마운트에 그대로 쓰므로 반드시 "호스트 경로"여야 하며,
      #       콘솔 컨테이너에도 동일 경로로 bind-mount 해 파일을 공유한다(아래 volumes).
      LLMOPS_EXEC__WORK_DIR: /home/jaehyun/Dev/naver/.runs
      LLMOPS_EXEC__REPO_DIR: /home/jaehyun/Dev/naver/llmops_core
      LLMOPS_EXEC__CONFIG_PATH: /home/jaehyun/Dev/naver/config/model_list.yaml
      LLMOPS_EXEC__HF_CACHE: /home/jaehyun/.cache/huggingface/hub
      LLMOPS_EXEC__TRAIN_IMAGE: llmops/train:latest
      # 파이프라인 학습/평가/서빙 기본 베이스 모델(HF 캐시에 사전 다운로드 필요)
      LLMOPS_EXEC__BASE_MODEL: naver-hyperclovax/HyperCLOVAX-SEED-Think-14B
      LLMOPS_EXEC__SERVE_BACKEND: vllm
      LLMOPS_EXEC__VLLM_IMAGE: vllm/vllm-openai:cu130-nightly # GB10(sm_121) 검증 이미지
      LLMOPS_EXEC__SERVE_PORT: "8020"
      LLMOPS_EXEC__SERVE_CONTAINER: llmops-tuned-serving
      LLMOPS_EXEC__GATEWAY_CONTAINER: llmops-infra-gateway-1
    volumes:
      - "../config:/app/config:ro"
      # 최신 콘솔 코드 라이브 마운트(editable 설치 /app 위에 덮어씀 — 재빌드 없이 반영)
      - "../llmops_core:/app/llmops_core"
      # 대시보드 GPU/서비스 텔레메트리 + real 모드용 host dockerd 제어
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/usr/bin/docker:/usr/bin/docker:ro"
      # host 동일 경로 bind-mount(위 LLMOPS_EXEC__* 경로 공유)
      - "/home/jaehyun/Dev/naver:/home/jaehyun/Dev/naver"
      - "/home/jaehyun/.cache/huggingface:/home/jaehyun/.cache/huggingface"
    extra_hosts: ["host.docker.internal:host-gateway"] # 콘솔 챗도 in-process 라우터 사용
    # --reload: bind-mount된 llmops_core 코드 변경 시 콘솔 자동 재기동(개발 편의).
    # uvicorn[standard]의 watchfiles가 /app/llmops_core를 감시한다.
    command:
      ["uvicorn", "llmops_core.console.app:app", "--host", "0.0.0.0", "--port", "4100",
       "--reload", "--reload-dir", "/app/llmops_core"]
    ports: ["4100:4100"]
    deploy: # nvidia-smi 주입(대시보드 GPU 검출) — GB10 단일 GPU 공유
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: 1, capabilities: [gpu] }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4100/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── 프런트엔드(web): Vite+React SPA(nginx) — /api는 console로 프록시 ──
  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    image: llmops/web:x86
    depends_on:
      console: { condition: service_started }
    ports: ["4200:80"]
    restart: unless-stopped

  # ── 서빙(선택, GPU 프로파일): transformers OpenAI 서버 (GB10 호환) ──
  # 실행: docker compose --profile gpu up -d
  # 게이트웨이 라우팅이 닿게 하려면 config/model_list.yaml의 api_base를 http://serving:8000/v1 로.
  serving:
    profiles: ["gpu"]
    build:
      context: ..
      dockerfile: deploy/serving/Dockerfile.hf
    command:
      [
        "--model",
        "naver-hyperclovax/HyperCLOVAX-SEED-Text-Instruct-0.5B",
        "--served-name",
        "hcx-seed-0_5b",
        "--port",
        "8000",
      ]
    ports: ["8000:8000"]
    volumes: ["hf_cache:/hf"]
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: 1, capabilities: [gpu] }

  # ── 관측성 옵션 A: Langfuse 제품 (채택 시 주석 해제, telemetry.backend=langfuse) ──
  # langfuse:
  #   image: langfuse/langfuse:latest
  #   depends_on: [postgres]
  #   environment:
  #     DATABASE_URL: postgresql://mlflow:mlflow@postgres/mlflow
  #     NEXTAUTH_SECRET: changeme
  #     SALT: changeme
  #   ports: ["3000:3000"]

volumes:
  minio_data:
  qdrant_data:
  pg_data:
  hf_cache:
