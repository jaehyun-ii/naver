# CI 게이트 (design 4.11) — 코드/프롬프트 변경 시 단위테스트 + 평가 게이트 실행.
# 기준 미달이면 빌드 실패 → 품질 회귀 차단. 통과 시 이미지 빌드/ArgoCD 트리거(후속 잡).
name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install core + dev
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check llmops_core
      - name: Unit tests (글루 핵심)
        run: pytest -q

  # 평가 게이트 — 모델/RAG 변경 PR에서 ragas/deepeval 정량 평가.
  # 판정 모델 키가 있을 때만 실행(없으면 스킵). 미달 시 step 실패로 머지 차단.
  eval-gate:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install eval extras
        run: pip install -e ".[evaluation]"
      - name: Run eval gate
        env:
          OPENAI_API_KEY: ${{ secrets.JUDGE_MODEL_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then echo "판정 모델 키 없음 — 평가 스킵"; exit 0; fi
          python -m llmops_core.pipelines.steps.evaluate \
            --testset evaluation_data/fixed_testset.jsonl \
            --threshold-faithfulness 0.8
