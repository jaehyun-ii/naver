<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>선급 청킹 리뷰 · 원본 ↔ 청크</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --ink:#1a1d21; --muted:#6b7280; --line:#e5e7eb;
    --accent:#2563eb; --accent-soft:#eff4ff; --shadow:0 1px 2px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0e1116;--panel:#161a20;--ink:#e6e8eb;--muted:#9aa3ad;--line:#262c34;
      --accent:#5b9dff;--accent-soft:#16223a;--shadow:0 1px 2px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100vh;overflow:hidden}
  /* toolbar */
  header{flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line);
    padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow);z-index:5}
  header h1{font-size:14px;margin:0;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
  select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;
    background:var(--panel);color:var(--ink);max-width:46vw}
  .stat{color:var(--muted);font-size:12.5px;white-space:nowrap}
  .stat b{color:var(--ink)}
  .grow{flex:1 1 auto}
  input[type=search]{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;
    background:var(--panel);color:var(--ink);width:200px}
  /* panes */
  main{flex:1 1 auto;display:grid;grid-template-columns:1fr 1fr;gap:0;min-height:0}
  .pane{min-height:0;overflow:auto;padding:16px 20px}
  .pane.left{border-right:1px solid var(--line)}
  .pane-h{position:sticky;top:-16px;background:var(--bg);margin:-16px -20px 12px;padding:10px 20px;
    border-bottom:1px solid var(--line);font-weight:700;font-size:12px;letter-spacing:.04em;
    text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px;z-index:2}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel);color:var(--muted);cursor:pointer;user-select:none;text-transform:none;letter-spacing:0}
  .chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
  /* markdown */
  .md h1,.md h2,.md h3,.md h4{line-height:1.3;margin:1.1em 0 .4em;font-weight:700}
  .md h1{font-size:1.5em;border-bottom:2px solid var(--line);padding-bottom:.2em}
  .md h2{font-size:1.25em} .md h3{font-size:1.1em} .md h4{font-size:1em;color:var(--muted)}
  .md p{margin:.5em 0} .md ul,.md ol{margin:.4em 0 .4em 1.2em;padding:0}
  .md table{border-collapse:collapse;margin:.7em 0;font-size:12.5px;width:auto;max-width:100%}
  .md td,.md th{border:1px solid var(--line);padding:4px 8px;vertical-align:top}
  .md img{max-width:100%}
  .imgph{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;margin:2px 0;border:1px dashed var(--line);
    border-radius:6px;color:var(--muted);font-size:12px;background:var(--panel)}
  .md .pgno{color:var(--muted);font-size:11px;text-align:center;margin:1.2em 0;opacity:.6}
  /* chunks */
  .art{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:0 0 12px;
    box-shadow:var(--shadow);overflow:hidden}
  .art-h{padding:9px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline;
    border-left:3px solid var(--accent)}
  .art-h:hover{background:var(--accent-soft)}
  .art-no{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
  .art-t{font-weight:600;flex:1 1 auto}
  .art-meta{color:var(--muted);font-size:11.5px;white-space:nowrap}
  .path{color:var(--muted);font-size:11px;padding:0 12px 8px;border-bottom:1px solid var(--line)}
  .kids{padding:6px 12px 10px}
  .kid{padding:6px 0;border-bottom:1px dashed var(--line)}
  .kid:last-child{border-bottom:0}
  /* 항(項) 라벨 + 호(號) 들여쓰기 트리 */
  .para{font-size:11px;font-weight:700;color:var(--accent);margin:9px 0 2px;letter-spacing:.02em}
  .para.sub{display:inline-block;background:var(--accent-soft);border-radius:4px;padding:1px 7px;font-size:11px}
  .uh{font-weight:700;color:var(--accent);margin-right:2px}
  .kid.ho{margin-left:16px;padding-left:12px;border-bottom:0;border-left:2px solid var(--line)}
  .kid.ho .kid-c{font-size:12.5px}
  .kid-h{display:flex;gap:8px;align-items:baseline;margin-bottom:2px}
  .kid-lh{font-weight:600;font-size:12.5px}
  .kid-c{white-space:pre-wrap;font-size:13px;color:var(--ink)}
  .kid-c.tbl{white-space:normal}
  .rows{margin-top:5px;font-size:12px}
  .rows summary{cursor:pointer;color:var(--muted)}
  .rows table{border-collapse:collapse;margin:5px 0;font-size:11.5px}
  .rows td{border:1px solid var(--line);padding:2px 6px}
  .refs{color:var(--muted);font-size:11px;margin-top:3px}
  /* type badges */
  .b{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:5px;white-space:nowrap;letter-spacing:.02em}
  .b-article{background:#334155;color:#fff}
  .b-text{background:#eef1f5;color:#475569}
  .hy{font-size:10.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);
    padding:1px 6px;border-radius:5px;white-space:nowrap}
  .b-requirement{background:#dcfce7;color:#166534} .b-procedure{background:#dbeafe;color:#1e40af}
  .b-condition{background:#fef3c7;color:#92400e} .b-exception{background:#fee2e2;color:#991b1b}
  .b-note{background:#ede9fe;color:#5b21b6} .b-definition{background:#ccfbf1;color:#115e59}
  .b-paragraph{background:#f1f5f9;color:#475569} .b-reference{background:#e0e7ff;color:#3730a3}
  .b-table{background:#ffedd5;color:#9a3412} .b-table_row{background:#f5f5f4;color:#78716c}
  .b-figure{background:#fce7f3;color:#9d174b}
  @media (prefers-color-scheme:dark){
    .b-requirement{background:#0f2e1c;color:#5fd68f} .b-procedure{background:#12233f;color:#7fb0ff}
    .b-condition{background:#3a2c0c;color:#f0c869} .b-exception{background:#3a1515;color:#ff9a9a}
    .b-note{background:#2a1c47;color:#c4b0f5} .b-definition{background:#0c3330;color:#5fded0}
    .b-text{background:#1c2530;color:#9fb0c2}
    .b-table{background:#3a230f;color:#f0a868} .b-table_row{background:#22201d;color:#b0a89c}
    .b-figure{background:#3a1428;color:#f5a0c8} .b-article{background:#3a4250;color:#fff}
  }
  .empty{color:var(--muted);text-align:center;padding:40px}
  .hidden{display:none!important}
  code{background:var(--accent-soft);padding:1px 5px;border-radius:4px;font-size:.9em}
  /* bidirectional link highlight */
  .mdblock{cursor:pointer;border-radius:4px;transition:background .12s}
  .mdblock:hover{background:var(--accent-soft)}
  .kid{cursor:pointer;border-radius:4px}
  .kid:hover{background:var(--accent-soft)}
  .linksel{background:var(--accent-soft)!important;box-shadow:inset 3px 0 0 var(--accent);
    padding-left:8px!important;margin-left:-8px}
  @keyframes flash{0%{background:var(--accent);color:#fff}100%{background:transparent}}
  .flash{animation:flash 1.1s ease-out}
  .linkhint{margin-left:auto;font-size:10px;color:var(--accent);opacity:0;white-space:nowrap}
  .kid:hover .linkhint,.mdblock:hover .linkhint{opacity:.7}
</style>
</head>
<body>
<header>
  <h1>선급 청킹 리뷰</h1>
  <select id="soc"></select>
  <select id="doc" style="flex:1 1 320px"></select>
  <span class="stat" id="stat"></span>
  <span class="grow"></span>
  <input type="search" id="q" placeholder="청크 내용 검색…">
</header>
<main>
  <section class="pane left">
    <div class="pane-h">원본 (.md) — PDF 대용</div>
    <div id="mdOut" class="md"><div class="empty">문서를 선택하세요</div></div>
  </section>
  <section class="pane right">
    <div class="pane-h">청킹 결과 <span class="chips" id="chips"></span></div>
    <div id="ckOut"><div class="empty">문서를 선택하세요</div></div>
  </section>
</main>
<script>
const socSel=document.getElementById('soc'), docSel=document.getElementById('doc'),
      stat=document.getElementById('stat'), mdOut=document.getElementById('mdOut'),
      ckOut=document.getElementById('ckOut'), chipsEl=document.getElementById('chips'),
      qEl=document.getElementById('q');
let MAN={}, CUR=null, CURSOC='', OFF=new Set();  // OFF = hidden types

const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// ---- faithful markdown render: 원문 그대로 (번호·줄바꿈 보존, 리스트 변환/문단병합 안 함) ----
// 헤딩(#), 원본 HTML 표, 이미지만 특수 처리하고 나머지는 있는 그대로 표시한다.
function renderMd(src){
  const out=[]; const lines=src.split('\n'); let para=[];
  const flush=()=>{ if(para.length){ out.push('<p class="mdp">'+para.map(inlineMd).join('<br>')+'</p>'); para=[]; } };
  for(const raw of lines){
    const line=raw.replace(/\s+$/,'');
    if(/^\s*<(table|html|body|thead|tbody|tr|td|th|div|img|figure)/i.test(line)){ flush(); out.push(line); continue; }
    if(/^\s*<\/(table|html|body|thead|tbody|tr)/i.test(line)){ out.push(line); continue; }
    if(!line.trim()){ flush(); continue; }
    let m;
    if(m=line.match(/^(#{1,6})\s+(.*)/)){ flush();
      const l=m[1].length; out.push(`<h${l}>${inlineMd(m[2])}</h${l}>`); continue; }
    if(m=line.match(/^!\[([^\]]*)\]\(([^)]+)\)\s*$/)){ flush();
      out.push(`<div class="imgph">🖼 <span>${esc(m[1]||m[2].split('/').pop())}</span></div>`); continue; }
    para.push(line);                          // 원문 줄 그대로 (번호 "109." "1." "(1)" 보존)
  }
  flush();
  return out.join('\n');
}
function inlineMd(s){
  s=s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,(_,a,u)=>`<span class="imgph">🖼 ${esc(a||u.split('/').pop())}</span>`);
  if(!/[<][a-zA-Z/]/.test(s)) s=esc(s);       // 원본 HTML 표는 통과, 일반 텍스트만 이스케이프
  return s;                                    // bold/italic/list 변환 없음 — 원문 충실
}

// ---- chunks rendering ----
function badge(t){return `<span class="b b-${t}">${t}</span>`;}
function renderChunks(rows){
  const parents=rows.filter(c=>c.chunk_level==='parent');
  const byParent={}; rows.forEach(c=>{ if(c.parent_chunk_id){(byParent[c.parent_chunk_id]=byParent[c.parent_chunk_id]||[]).push(c);} });
  const frag=[];
  for(const p of parents){
    const kids=(byParent[p.chunk_id]||[]);
    // breadcrumb: 조 앞까지 (장 > 절) + 조는 헤더에 별도 표시
    const path=(p.section_path||[]).slice(0,-1).join('  ›  ');
    const no=p.article_no||''; const title=esc(p.article_title||p.doc_title||'(intro)');
    frag.push(`<div class="art" data-types="${[p.chunk_type,...kids.map(k=>k.chunk_type)].join(' ')}"
        data-text="${esc(((p.content||'')+' '+kids.map(k=>k.content||'').join(' ')).toLowerCase()).slice(0,4000)}">
      <div class="art-h" onclick="this.parentNode.querySelector('.kids').classList.toggle('hidden');this.parentNode.querySelector('.path').classList.toggle('hidden')">
        <span class="art-no">${esc(no)}</span><span class="art-t">${title}</span>
        <span class="art-meta">${kids.filter(k=>k.chunk_type==='text').length}단위 · ${p.content_tokens||0}tok ${badge('article')}</span>
      </div>
      ${path?`<div class="path">${esc(path)}</div>`:''}
      <div class="kids">${renderKids(kids,byParent)}</div>
    </div>`);
  }
  return frag.join('')||'<div class="empty">청크 없음</div>';
}
// 조 > 항 > 호(들여쓰기) > 목/세목(호 내부) 트리
function renderKids(kids,byParent){
  const text=kids.filter(k=>k.chunk_type==='text');
  const tf=kids.filter(k=>k.chunk_type==='table'||k.chunk_type==='figure');
  const groups=[]; let g=null;
  for(const k of text){
    const pn=k.paragraph_no||'';
    if(!g || g.pn!==pn){ g={pn,items:[]}; groups.push(g); }
    g.items.push(k);
  }
  let html='';
  for(const grp of groups){
    if(grp.pn){
      // KR: 모든 항 그룹에 "항 N" 헤더. 그 외(IACS 등): 하위조항이 실제 항목을 묶을 때만 번호 칩
      if(CURSOC==='KR') html+=`<div class="para">항 ${esc(grp.pn)}</div>`;
      else if(grp.items.some(k=>k.item_no)) html+=`<div class="para sub">${esc(grp.pn)}</div>`;
    }
    html+=grp.items.map(renderUnit).join('');
  }
  html+=tf.map(k=>renderKid(k,byParent)).join('');
  return html||'<div class="empty" style="padding:12px">내용 없음</div>';
}
function renderUnit(k){                       // 텍스트 단위. 항목(호/a)/(1))은 들여쓰기.
  const hd=k.item_no&&!(k.content||'').trim().startsWith(k.item_no)
           ? `<span class="uh">${esc(k.item_no)}</span> ` : '';
  return `<div class="kid${k.item_no?' ho':''}" data-ct="text"><div class="kid-c">${hd}${esc(k.content||'')}</div></div>`;
}
function renderKid(k,byParent){
  if(k.chunk_type==='table'){
    const rws=(byParent[k.chunk_id]||[]).filter(r=>r.chunk_type==='table_row');
    const rowsTbl=rws.length?`<details class="rows"><summary>${rws.length} 행 단위 청크</summary>${
      rws.map(r=>`<div>${esc(r.content||'')}</div>`).join('')}</details>`:'';
    return `<div class="kid" data-ct="table"><div class="kid-h">${badge('table')}<span class="kid-lh">${esc(k.table_caption||k.content||'표')}</span>
      <span class="art-meta">${k.table_nrows||0}행</span></div>
      <div class="kid-c tbl">${k.table_html||''}</div>${rowsTbl}</div>`;
  }
  if(k.chunk_type==='table_row') return '';
  if(k.chunk_type==='figure')
    return `<div class="kid" data-ct="figure"><div class="kid-h">${badge('figure')}<span class="kid-lh">${esc(k.caption||'그림')}</span></div>
      <div class="imgph">🖼 ${esc((k.image_path||'').split('/').pop())}</div></div>`;
  return '';
}

// ---- data loading ----
async function loadDoc(soc,idx){
  mdOut.innerHTML='<div class="empty">로딩…</div>'; ckOut.innerHTML='<div class="empty">로딩…</div>';
  const base=`data/${soc}/${idx}`;
  const [md,ck]=await Promise.all([
    fetch(`${base}/source.md`).then(r=>r.text()),
    fetch(`${base}/chunks.jsonl`).then(r=>r.text())
  ]);
  const rows=ck.trim().split('\n').filter(Boolean).map(l=>JSON.parse(l));
  CUR=rows; CURSOC=soc;
  mdOut.innerHTML=renderMd(md);
  ckOut.innerHTML=renderChunks(rows);
  buildChips(rows);
  applyFilter();
  wireLinks();
  ckOut.scrollTop=0; mdOut.scrollTop=0;
}

// ---- bidirectional chunk ↔ md linking (normalized-text matching) ----
let MDBLOCKS=[], KIDS=[];
const norm=s=>(s||'').replace(/\s+/g,' ').trim().toLowerCase();
function wireLinks(){
  MDBLOCKS=[...mdOut.querySelectorAll('h1,h2,h3,h4,h5,h6,p,li,table')];
  MDBLOCKS.forEach(el=>{ el.classList.add('mdblock'); el._norm=norm(el.textContent);
    el.onclick=()=>onMdClick(el); });
  KIDS=[...ckOut.querySelectorAll('.kid')];
  KIDS.forEach(k=>{ const c=k.querySelector('.kid-c'); k._norm=norm(c?c.textContent:k.textContent);
    k.addEventListener('click',e=>{ if(e.target.closest('summary'))return; onKidClick(k); }); });
}
function findMatch(sig,list){
  if(!sig||sig.length<8) return null;
  for(const len of [50,30,18]){
    const q=sig.slice(0,len); if(q.length<8) continue;
    for(const el of list){ if(el._norm&&el._norm.length>=8&&el._norm.includes(q)) return el; }
  }
  for(const el of list){ const n=el._norm;      // chunk aggregates several md lines
    if(n&&n.length>=12&&sig.includes(n.slice(0,Math.min(40,n.length)))) return el; }
  return null;
}
function clearSel(){ document.querySelectorAll('.linksel').forEach(e=>e.classList.remove('linksel')); }
function flash(el){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  setTimeout(()=>el.classList.remove('flash'),1150); }
function onKidClick(kid){ clearSel(); kid.classList.add('linksel');
  const el=findMatch(kid._norm,MDBLOCKS);
  if(el){ el.classList.add('linksel'); el.scrollIntoView({block:'center',behavior:'smooth'}); flash(el); } }
function onMdClick(el){ clearSel(); el.classList.add('linksel');
  const kid=findMatch(el._norm,KIDS);
  if(kid){ const art=kid.closest('.art'); art?.classList.remove('hidden');
    art?.querySelector('.kids')?.classList.remove('hidden'); kid.classList.remove('hidden');
    kid.classList.add('linksel'); kid.scrollIntoView({block:'center',behavior:'smooth'}); flash(kid); } }
function buildChips(rows){
  const ty={}; rows.forEach(c=>ty[c.chunk_type]=(ty[c.chunk_type]||0)+1);
  const order=['article','text','table','table_row','figure'];
  chipsEl.innerHTML=order.filter(t=>ty[t]).map(t=>
    `<span class="chip ${OFF.has(t)?'':'on'}" data-t="${t}" onclick="toggleType('${t}')">${t} ${ty[t]}</span>`).join('');
}
function toggleType(t){ OFF.has(t)?OFF.delete(t):OFF.add(t);
  document.querySelector(`.chip[data-t="${t}"]`)?.classList.toggle('on'); applyFilter(); }
function applyFilter(){
  const q=qEl.value.trim().toLowerCase();
  document.querySelectorAll('.art').forEach(a=>{
    const types=(a.dataset.types||'').split(' ');
    const typeOk=types.some(t=>!OFF.has(t));
    const textOk=!q||(a.dataset.text||'').includes(q);
    a.classList.toggle('hidden',!(typeOk&&textOk));
    // per-kid type hiding
    a.querySelectorAll('.kid').forEach(k=>{
      const t=k.dataset.ct; if(t) k.classList.toggle('hidden',OFF.has(t));
    });
  });
}
qEl.addEventListener('input',applyFilter);

// ---- selectors ----
function fillDocs(soc){
  const docs=MAN[soc].docs;
  docSel.innerHTML=docs.map(d=>`<option value="${d.idx}">${d.title} (${d.n_articles}조/${d.n_chunks}청크)</option>`).join('');
  onDoc();
}
function onSoc(){ fillDocs(socSel.value); }
function onDoc(){
  const soc=socSel.value, idx=docSel.value;
  const d=MAN[soc].docs.find(x=>String(x.idx)===String(idx));
  stat.innerHTML=`<b>${d.n_articles}</b> 조 · <b>${d.n_chunks}</b> 청크`;
  OFF.clear(); loadDoc(soc,idx);
}
socSel.addEventListener('change',onSoc);
docSel.addEventListener('change',onDoc);

fetch('data/manifest.json').then(r=>r.json()).then(m=>{
  MAN=m;
  socSel.innerHTML=Object.entries(m).map(([k,v])=>`<option value="${k}">${v.label} (${v.docs.length})</option>`).join('');
  onSoc();
});
</script>
</body>
</html>
